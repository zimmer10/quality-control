[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ecup-quality-control"
version = "0.1.0"
description = "E-CUP quality-control competition solution"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "Pillow>=10.0",
  "polars>=1.0",
  "pyarrow>=12.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
embeddings = [
  "qwen-vl-utils>=0.0.14",
  "sentence-transformers>=5.4.0",
  "torch>=2.8",
  "torchvision>=0.23",
  "transformers>=4.57.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
