version: 1
exclusion_window: 80

negation_patterns:
  - '(?<!\w)не(?!\w)'
  - '(?<!\w)без(?!\w)'
  - '(?<!\w)отсутств\w*'
  - '(?<!\w)отдельно(?!\w)'

categories:
  БАД:
    signals:
      explicit_bad_marker:
        patterns:
          - '(?<!\w)б\.?\s*а\.?\s*д\.?(?!\w)'
          - 'биологическ\w*\s+активн\w*\s+добавк\w*'
          - 'биодобавк\w*'
        exclude_patterns:
          - 'не\s+(?:явля\w*|относ\w*|счита\w*)\s+(?:биологическ\w*\s+активн\w*\s+добавк\w*|б\.?\s*а\.?\s*д\.?)'
          - 'не\s+(?:биологическ\w*\s+активн\w*\s+добавк\w*|б\.?\s*а\.?\s*д\.?)'
      dietary_supplement_marker:
        patterns:
          - '(?<!\w)dietary\s+supplements?(?!\w)'
          - '(?<!\w)food\s+supplements?(?!\w)'
        exclude_patterns:
          - '(?:not|no)\s+(?:a\s+)?(?:dietary|food)\s+supplements?'
      explicit_not_bad:
        patterns:
          - 'не\s+(?:явля\w*|относ\w*|счита\w*)\s+(?:биологическ\w*\s+активн\w*\s+добавк\w*|б\.?\s*а\.?\s*д\.?)'
          - 'не\s+(?:биологическ\w*\s+активн\w*\s+добавк\w*|б\.?\s*а\.?\s*д\.?)'
          - '(?:not|no)\s+(?:a\s+)?(?:dietary|food)\s+supplements?'
        exclude_patterns: []
      sport_nutrition:
        patterns:
          - 'спортивн\w*\s+питан\w*'
          - '(?<!\w)(?:bcaa|бцаа)(?!\w)'
          - '(?<!\w)(?:l[\s-]?(?:карнитин|carnitine))(?!\w)'
          - '(?<!\w)аминокислот\w*'
          - '(?<!\w)(?:протеин\w*|protein)(?!\w)'
          - '(?<!\w)(?:гейнер\w*|creatine|креатин\w*)(?!\w)'
          - '(?<!\w)(?:предтрен\w*|pre[\s-]?workout)(?!\w)'
        exclude_patterns: []

  Легковоспламеняющиеся:
    signals:
      independent_ignition_source:
        patterns:
          - '(?<!\w)зажигалк\w*'
          - '(?<!\w)спичк\w*'
          - '(?<!\w)огнив\w*'
        exclude_patterns:
          - '(?:чехл\w*|чехол\w*|футляр\w*|держател\w*|подставк\w*|наклейк\w*|кремн\w*|фитил\w*|запчаст\w*|ремкомплект\w*).{0,40}(?:зажигалк\w*|спичк\w*)'
          - '(?:спичечниц\w*|короб\w*\s+для\s+спич\w*)'
          - 'без\s+(?:спичк\w*|зажигалк\w*)'
      fuel_present:
        patterns:
          - 'жидкост\w*\s+для\s+(?:розжиг\w*|зажигал\w*)'
          - '(?:газ\w*\s+(?:баллон\w*|картридж\w*)|(?:баллон\w*|картридж\w*)\s+газ\w*)'
          - '(?:газ|бензин)\w*\s+для\s+зажигал\w*'
          - '(?:сух\w*\s+топлив\w*|топлив\w*\s+сух\w*)'
          - '(?<!\w)(?:биоэтанол\w*|керосин\w*)(?!\w)'
          - '(?:древесн\w*\s+угол\w*|угол\w*\s+древесн\w*)'
          - 'угол\w*\s+для\s+(?:мангал\w*|грил\w*|кальян\w*)'
          - '(?:брик(?:ет|еты)\w*|палочк\w*)\s+для\s+розжиг\w*'
        exclude_patterns:
          - '(?:фильтр\w*|картридж\w*)\s+(?:с|из)\s+активированн\w*\s+угл\w*'
          - 'угол\w*\s+для\s+рисован\w*'
          - '(?:чехол\w*|сумк\w*|держател\w*|подогрев\w*|переходник\w*|редуктор\w*).{0,50}(?:баллон\w*|картридж\w*)'
          - '(?:баллон\w*|картридж\w*).{0,50}(?:чехол\w*|сумк\w*|держател\w*|подогрев\w*|переходник\w*|редуктор\w*)'
          - '(?:баллон\w*|картридж\w*).{0,20}пуст\w*'
      fuel_included:
        patterns:
          - '(?:баллон\w*|картридж\w*|газ\w*|топлив\w*|жидкост\w*).{0,45}(?:вход\w*|включ\w*|в\s+комплект\w*)'
          - 'в\s+комплект\w*.{0,45}(?:баллон\w*|картридж\w*|газ\w*|топлив\w*|жидкост\w*)'
          - 'заправлен\w*\s+(?:газ\w*|топлив\w*)'
        exclude_patterns:
          - '(?:не\s+(?:вход\w*|включ\w*)|без\s+(?:баллон\w*|картридж\w*|газ\w*|топлив\w*))'
      requires_external_fuel:
        patterns:
          - 'работ\w*.{0,30}(?:от|с)\s+(?:внешн\w*\s+)?(?:газов\w*\s+)?(?:баллон\w*|картридж\w*)'
          - 'подключ\w*.{0,35}(?:баллон\w*|картридж\w*|газ\w*)'
          - 'треб\w*.{0,35}(?:баллон\w*|картридж\w*|газ\w*|топлив\w*)'
          - '(?:баллон\w*|картридж\w*|газ\w*|топлив\w*).{0,35}(?:приобрета\w*|покупа\w*)\s+отдельно'
          - 'под\s+(?:сменн\w*\s+)?(?:газов\w*\s+)?(?:баллон\w*|картридж\w*)'
        exclude_patterns: []
      flammable_item_in_kit:
        patterns:
          - 'в\s+комплект\w*.{0,55}(?:зажигалк\w*|спичк\w*|баллон\w*|картридж\w*|топлив\w*|жидкост\w*\s+для\s+розжиг\w*)'
          - '(?:зажигалк\w*|спичк\w*|баллон\w*|картридж\w*|топлив\w*).{0,45}(?:вход\w*|включ\w*)\s+в\s+комплект\w*'
        exclude_patterns:
          - 'не\s+(?:вход\w*|включ\w*)\s+в\s+комплект\w*'
      flammable_item_not_in_kit:
        patterns:
          - '(?:зажигалк\w*|спичк\w*|баллон\w*|картридж\w*|топлив\w*).{0,35}не\s+(?:вход\w*|включ\w*)\s+в\s+комплект\w*'
          - 'в\s+комплект\w*.{0,35}не\s+(?:вход\w*|включ\w*).{0,35}(?:зажигалк\w*|спичк\w*|баллон\w*|картридж\w*|топлив\w*)'
          - 'без\s+(?:спичк\w*|зажигалк\w*)'
        exclude_patterns: []
      explicit_without_fuel:
        patterns:
          - '(?:баллон\w*|картридж\w*|газ\w*|топлив\w*|горюч\w*).{0,30}не\s+(?:вход\w*|включ\w*|поставля\w*)'
          - '(?:без|не\s+содерж\w*)\s+(?:газ\w*|топлив\w*|баллон\w*|картридж\w*|горюч\w*)'
          - 'поставля\w*\s+без\s+(?:газ\w*|топлив\w*|баллон\w*|картридж\w*)'
          - '(?:баллон\w*|картридж\w*|газ\w*|топлив\w*).{0,35}(?:приобрета\w*|покупа\w*)\s+отдельно'
          - '(?:баллон\w*|картридж\w*|емкост\w*).{0,20}пуст\w*'
          - 'пуст\w*.{0,20}(?:баллон\w*|картридж\w*|емкост\w*)'
        exclude_patterns: []
      device_with_embedded_ignition:
        patterns:
          - '(?:пьезо|электро)[\s-]?поджиг\w*'
          - 'встроенн\w*.{0,30}(?:поджиг\w*|источник\w*\s+зажиган\w*)'
        exclude_patterns: []
      flammable_component:
        patterns:
          - '(?:фильтр\w*|картридж\w*).{0,45}активированн\w*\s+угл\w*'
          - 'активированн\w*\s+угол\w*.{0,45}(?:фильтр\w*|картридж\w*)'
          - 'угольн\w*.{0,20}(?:фильтр\w*|картридж\w*)'
          - 'угол\w*\s+для\s+рисован\w*'
        exclude_patterns: []
      combustible_device:
        patterns:
          - '(?<!\w)(?:мангал\w*|грил\w*|горелк\w*|камин\w*|печ\w*|обогревател\w*)(?!\w)'
          - 'газов\w*\s+плит\w*'
        exclude_patterns: []
